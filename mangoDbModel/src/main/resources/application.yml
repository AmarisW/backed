#################################  项目基础配置 #################################
server:
  port: 2001                              # 服务端口
  servlet:
    context-path: /mangoDBModel           # 项目访问路径

#################################  配置启动环境 #################################
spring:
  main:
    allow-bean-definition-overriding: true  # 允许 bean 定义覆盖
  application:
    name: mangoDBModel                    # 项目名称
  profiles:
    active: base                          # 启用配置文件版本
  config:
    import:
      - classpath:application-custom.yml  # 导入自定义配置

#################################  日志配置  #################################
logging:
  file:
    name: ./adventLogs/${logging.level.root}.log
  level:
    root: info
  logback:
    rolling-policy:
      max-history: 20
      max-file-size: 200MB

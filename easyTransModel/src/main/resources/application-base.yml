#################################  Spring  #################################
spring:
  datasource:
    dynamic:
      primary: master                     # 默认数据源
      strict: false                       # 不存在时使用默认数据源
      datasource:
        #----------------------- Mysql -----------------------#
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://101.43.87.108:3306/easy_trans?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: REDACTED

#################################  Mybatis-plus  #################################
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # SQL 打印到工作台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#################################  自定义配置  #################################
easy-trans:
  is-enable-redis: false                  # 入门默认关闭 Redis，无需额外安装
  is-enable-global: false                 # 全局拦截 ResponseBody 自动翻译
  is-enable-tile: true                    # 平铺模式，翻译字段直接出现在 JSON 中

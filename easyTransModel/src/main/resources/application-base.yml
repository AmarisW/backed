#################################  Spring  #################################
spring:
  datasource:
    dynamic:
      primary: master                     # 默认数据源
      strict: false                       # 不存在时使用默认数据源
      datasource:
        #----------------------- Mysql -----------------------#
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://101.43.87.108:3306/easy_trans?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          username: root
          password: ${EASY_TRANS_MYSQL_PASSWORD}

  #----------------------- Redis -----------------------#
  data:
    redis:
      host: 101.43.87.108                     # Redis 地址
      port: 6379                          # Redis 端口
      password: ${EASY_TRANS_REDIS_PASSWORD}             # Redis 密码（无密码留空）
      database: 0                         # Redis 数据库
      timeout: 5000ms                     # 连接超时时间
      lettuce:
        pool:
          max-active: 8                    # 最大连接数
          max-idle: 8                      # 最大空闲连接
          min-idle: 0                      # 最小空闲连接
          max-wait: -1ms                   # 最大等待时间

#################################  Mybatis-plus  #################################
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # SQL 打印到工作台
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#################################  Easy-Trans  #################################
easy-trans:
  is-enable-redis: true                   # 启用 Redis 支持（RPC 缓存清理、字典广播等）
  dict-use-redis: true                    # 字典写入 Redis 二级缓存（框架自动维护 key 格式）
  is-enable-global: false                 # 全局拦截 ResponseBody 自动翻译
#  is-enable-tile: true                   # 平铺模式
#  mp-new: true                           # MyBatis-Plus 3.5.3.2+ 需开启

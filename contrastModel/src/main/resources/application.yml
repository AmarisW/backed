#################################  项目基础配置 #################################
server:
  port: 2000                              # 服务端口
  servlet:
    context-path: /contrastModel          # 项目访问路径
  tomcat:
    max-part-count: 100                   # 最大请求部分数量（影响表单提交的最大项）

#################################  配置启动环境 #################################
spring:
  application:
    name: contrastModel                    #  项目名称
  profiles:
    active: base                           # 启用配置文件版本
  isEnable: true                           # 是否启用初始化字典
  waitSqlPrint: true                       # 是否等待SQL打印
  config:
    import:
      - classpath:application-custom.yml   # 导入自定义配置


#################################  日志配置  #################################
logging:
  file:
    name: ./adventLogs/${logging.level.root}.log
  level:
    root: info
  logback:
    rolling-policy:
      max-history: 20
      max-file-size: 200MB

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>预览页面</title>
  <!-- <link rel="stylesheet" type="text/css" href="css/style.css" /> -->
  <style>
    * {
      padding: 0;
      margin: 0;
      font-family: "楷体", serif;
    }

    header {
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(image/backImage.jpg);
      height: 100vh;
      background-size: cover;
      background-position: center;
    }

    ul {
      float: right;
      list-style-type: none;
      margin: 15px;
    }

    ul li {
      display: inline-block;
    }

    ul li a {
      text-decoration: none;
      color: #fff;
      padding: 5px 20px;
      border: 1px solid transparent;
      transition: .6s ease;
      border-radius: 20px;
    }

    ul li a:hover {
      background-color: #fff;
      color: #000;
    }

    ul li.active a {
      background-color: #fff;
      color: #000;
    }

    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .title h1 {
      color: #fff;
      font-size: 70px;
      font-family: Century Gothic, serif;
    }

    .api-link {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.2);
      padding: 15px 30px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .api-link:hover {
      background-color: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%) scale(1.05);
    }

    .api-link a {
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
<header>
  <div class="main">
    <ul>
      <li class="active"><a href="#">首页</a></li>
      <!--      <li><a href="https://www.bing.com" target="_blank">Bing</a></li>-->
      <!--      <li><a href="https://blog.csdn.net" target="_blank"><span style="color: crimson;">C</span>SDN官网</a></li>-->
      <li><a href="apis.html">🔍<span style="color: crimson;">开放</span>接口</a></li>
    </ul>
  </div>
  <div class="title">
    <h1><span style="color: crimson;">Welcome</span> Homepage</h1>
  </div>
</header>
</body>
</html>

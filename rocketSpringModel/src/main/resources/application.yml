#################################  项目基础配置 #################################
server:
  port: 2000                              # 服务端口
  servlet:
    context-path: /rocketSpringModel        # 项目访问路径

#################################  配置启动环境 #################################
spring:
  application:
    name: rocketSpringModel                  #  项目名称
  profiles:
    active: base                           # 启用配置文件版本
  isEnable: true                           # 是否启用初始化字典
  config:
    import:
      - classpath:application-custom.yml   # 导入自定义配置


#################################  日志配置  #################################
logging:
  file:
    name: ./adventLogs/${logging.level.root}.log
  level:
    root: info
  logback:
    rolling-policy:
      max-history: 20
      max-file-size: 200MB
